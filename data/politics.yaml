# ============================================================================
# CAMPAIGN EVENT TEMPLATES
# ============================================================================
campaign_events:
  rallies:
    - '{candidate} holds rally in {borough}, promises to fight for working families'
    - '{candidate} speaks at {location}, draws crowd of supporters'
    - '{candidate} debates rivals at town hall in {borough}'
    - '{candidate} marches through {borough} shaking hands and kissing babies'
    - '{candidate} holds press conference on steps of City Hall'
    - '{candidate} rallies union workers at labor hall'
    - '{candidate} hosts community forum on crime in {borough}'
    - '{candidate} appears at senior center in {borough}, talks transit'
    - 'Supporters of {candidate} hand out flyers across {borough}'
    - '{candidate} gives fiery speech at rally: "This city deserves better!"'
  scandals:
    - '{candidate} accused of misusing campaign funds'
    - 'Former aide claims {candidate} made backroom deal with developers'
    - '{candidate} caught in embarrassing photo at nightclub'
    - 'Rival campaign leaks damaging memo about {candidate}'
    - '{candidate} faces questions about unreported income'
    - 'Anonymous tip alleges {candidate} has ties to organized crime'
    - '{candidate} flip-flops on rent control stance, opponents pounce'
    - '{candidate} no-shows scheduled debate, campaign cites "scheduling conflict"'
    - 'NY Post runs front page exposé on {candidate}''s past'
    - '{candidate} staffer quits, calls campaign "a circus"'
  endorsements:
    - '{endorser} endorses {candidate} for {office}: "The clear choice"'
    - 'Police union backs {candidate} in {office} race'
    - 'Teachers union throws support behind {candidate}'
    - 'Transit workers endorse {candidate}, citing transit platform'
    - 'NY Daily News editorial board endorses {candidate}'
    - 'NY Post endorses {candidate} for {office}'
    - 'Local church leaders rally behind {candidate}'
    - 'Prominent business leaders announce support for {candidate}'
    - 'Community board in {borough} endorses {candidate}'
    - '{candidate} picks up key endorsement from outgoing {office}'

# ============================================================================
# POLITICAL NEWS HEADLINES
# ============================================================================
political_news:
  general:
    - 'City Hall insiders say mayor''s approval rating is {trend}'
    - 'Poll shows {percent}% of New Yorkers approve of mayor''s job performance'
    - 'Political analysts debate who will run in next election'
    - 'Voter registration drive sweeps through {borough}'
    - 'Community board meeting in {borough} gets heated over development'
    - 'Borough president of {borough} announces new initiative'
    - 'City comptroller raises concerns about budget shortfall'
    - 'Public advocate calls for investigation into city contracts'
    - 'Political operatives already jockeying for next election cycle'
    - 'Albany and City Hall clash over funding priorities'
  election_season:
    - 'Campaign season heats up as candidates crisscross the city'
    - 'New poll shows tight race for {office}'
    - 'Candidates spar over crime policy at debate'
    - 'Rent control emerges as key issue in {office} race'
    - 'Transit funding becomes flashpoint in campaign'
    - 'Voter turnout expected to be {level} in upcoming election'
    - 'Undecided voters could swing {office} race'
    - 'Campaign spending breaks records in {office} contest'
    - 'Last-minute attack ads flood airwaves in {office} race'
    - 'Both parties scramble to get out the vote in {borough}'
  results:
    - '{winner} wins {office} in {margin} victory'
    - '{winner} elected {office}, promises "a new direction for the city"'
    - 'Upset! {winner} defeats incumbent in {office} race'
    - '{winner} cruises to victory in {office} contest'
    - 'Voters send clear message, elect {winner} as {office}'
    - '{winner} claims mandate after decisive {office} win'
    - 'Close race: {winner} edges out {loser} for {office}'
    - 'Record turnout propels {winner} to {office}'

# ============================================================================
# TIMED WORLD EVENTS (1999 NYC Historical)
# ============================================================================
# These fire based on sim-date, adding historical texture.
# month is 0-indexed (0=Jan, 1=Feb, ..., 11=Dec).
# opinion_drift applies to all agents (or scoped by borough).
timed_events:
  - id: diallo_aftermath
    title: 'Amadou Diallo Aftermath'
    month: 1
    day_range: [4, 28]
    recurrence: periodic
    interval_days: 7
    headlines:
      - 'Protests continue over Amadou Diallo shooting; demonstrators arrested at City Hall'
      - 'Rev. Al Sharpton leads march across Brooklyn Bridge demanding police accountability'
      - 'Community leaders call for independent review of NYPD shooting policies'
      - 'Vigil held in the Bronx for Amadou Diallo; crowd demands justice'
    opinion_drift:
      issue: crime_policing
      amount: -3
      borough_boost: { bronx: -5 }

  - id: y2k_preparation
    title: 'Y2K Preparation'
    month_range: [3, 11]
    recurrence: escalating
    interval_days: 14
    headlines:
      - 'City announces Y2K preparedness plan for critical infrastructure'
      - 'Banks assure customers: "Your money is safe" as Y2K fears mount'
      - 'Tech workers pull overtime as companies race to patch Y2K bugs'
      - 'MTA tests subway systems for Y2K compliance; officials cautiously optimistic'
      - 'FEMA releases Y2K emergency guide; New Yorkers advised to stock supplies'
      - 'Wall Street firms spend millions on Y2K readiness as December approaches'
      - 'Mayor reassures city: "We will be ready for the millennium"'
    opinion_drift:
      issue: transit
      amount: -1

  - id: sensation_controversy
    title: 'Brooklyn Museum "Sensation" Controversy'
    month: 9
    day_range: [1, 31]
    recurrence: periodic
    interval_days: 5
    headlines:
      - 'Giuliani threatens to cut Brooklyn Museum funding over "Sensation" exhibit'
      - 'First Amendment groups rally behind Brooklyn Museum in art censorship battle'
      - 'Art world vs. City Hall: "Sensation" exhibit becomes national controversy'
      - 'Brooklyn Museum defies mayor, opens "Sensation" to record crowds'
      - 'Giuliani calls artwork "disgusting"; museum supporters call it censorship'
    opinion_drift:
      issue: quality_of_life
      amount: -2
      borough_boost: { brooklyn: -3 }

  - id: transit_fare_debate
    title: 'Transit Fare Hike Debate'
    month_range: [4, 8]
    recurrence: periodic
    interval_days: 10
    headlines:
      - 'MTA board considers fare hike; riders brace for higher costs'
      - 'Straphangers Campaign rallies against proposed subway fare increase'
      - 'Commuters furious as MTA floats $2.00 MetroCard fare'
      - 'City Council members demand MTA find savings before raising fares'
      - 'Transit advocates warn fare hike will hurt working-class New Yorkers most'
    opinion_drift:
      issue: transit
      amount: -2
