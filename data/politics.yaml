# ============================================================================
issues:
  - id: crime_policing
    label: 'Crime & Policing'
    negative_label: 'Civil Liberties'
    positive_label: 'Tough on Crime'
    description: 'Broken windows policing, stop-and-frisk, CompStat, Amadou Diallo'
  - id: development
    label: 'Development'
    negative_label: 'Preservation'
    positive_label: 'Pro-Development'
    description: 'Times Square cleanup, gentrification, Disney-fication of Manhattan'
  - id: rent_housing
    label: 'Rent & Housing'
    negative_label: 'Pro-Tenant'
    positive_label: 'Pro-Market'
    description: 'Rent stabilization, tenant protections, affordable housing crisis'
  - id: transit
    label: 'Transit'
    negative_label: 'Fiscal Restraint'
    positive_label: 'More MTA Funding'
    description: 'Subway reliability, MetroCard expansion, MTA capital plan'
  - id: quality_of_life
    label: 'Quality of Life'
    negative_label: 'Oppose Crackdowns'
    positive_label: 'Support Crackdowns'
    description: 'Squeegee men, jaywalking tickets, street vendor regulation'

