# ============================================================================
# NYC 1999 POLITICAL SYSTEM
# ----------------------------------------------------------------------------
# Offices, parties, issues, initial officeholders, campaign events,
# and political news -- modeled on the real NYC political landscape of 1999.
# ============================================================================

# ============================================================================
# ELECTED OFFICES
# ============================================================================
offices:
  - id: mayor
    title: 'Mayor'
    scope: citywide
    term_length_days: 90
    description: 'Chief executive of the City of New York'
  - id: public_advocate
    title: 'Public Advocate'
    scope: citywide
    term_length_days: 90
    description: 'Ombudsman and watchdog for city government'
  - id: comptroller
    title: 'Comptroller'
    scope: citywide
    term_length_days: 90
    description: 'Chief financial officer of the city'
  - id: bp_manhattan
    title: 'Manhattan Borough President'
    scope: manhattan
    term_length_days: 90
    description: 'Borough president of Manhattan'
  - id: bp_brooklyn
    title: 'Brooklyn Borough President'
    scope: brooklyn
    term_length_days: 90
    description: 'Borough president of Brooklyn'
  - id: bp_queens
    title: 'Queens Borough President'
    scope: queens
    term_length_days: 90
    description: 'Borough president of Queens'
  - id: bp_bronx
    title: 'Bronx Borough President'
    scope: bronx
    term_length_days: 90
    description: 'Borough president of the Bronx'
  - id: bp_staten_island
    title: 'Staten Island Borough President'
    scope: staten_island
    term_length_days: 90
    description: 'Borough president of Staten Island'

# ============================================================================
# POLITICAL PARTIES
# ============================================================================
