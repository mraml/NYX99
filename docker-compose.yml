version: '3.9'

services:
  # Primary Database: PostgreSQL + PostGIS + TimescaleDB
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: nyc_sim_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nyc_simulation}
      POSTGRES_USER: ${DB_USER:-simadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      TIMESCALEDB_TELEMETRY: off
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    command: >
      postgres
      -c shared_preload_libraries=timescaledb
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c log_statement=none
      -c log_duration=off
      -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-simadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sim_network

  # Redis: Cache for world context (weather, news, events)
  redis:
    image: redis:7-alpine
    container_name: nyc_sim_cache
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sim_network

  # pgAdmin: Database management UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nyc_sim_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@localhost.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sim_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  sim_network:
    driver: bridge